<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>聚玻明视 - AI 助手</title>
    <script>
      // 主题初始化：优先读取本地存储，其次跟随系统，最后默认暗色，避免首屏闪烁
      ;(function () {
        var t = null
        try { t = localStorage.getItem('app-theme') } catch (e) {}
        var dark = t ? t === 'dark' : true
        var el = document.documentElement
        if (dark) el.classList.add('dark')
        else el.classList.remove('dark')
      })()
    </script>
    <style>
      /* ===== 首屏加载占位：在 Vue 挂载前展示，避免白屏 ===== */
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      .app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f7fa;
        color: #00a8e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      html.dark .app-loading {
        background: #0f1115;
        color: #7b61ff;
      }
      .loading-orb {
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow: 0 8px 32px rgba(31, 71, 96, 0.12),
          inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        animation: loading-float 3s ease-in-out infinite;
      }
      html.dark .loading-orb {
        background: rgba(30, 34, 45, 0.55);
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45),
          inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .loading-orb svg {
        animation: loading-spin 2s linear infinite;
        filter: drop-shadow(0 0 12px currentColor);
      }
      .loading-brand {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #2c3e50;
      }
      html.dark .loading-brand {
        color: #eaeaea;
      }
      .loading-text {
        font-size: 13px;
        color: rgba(44, 62, 80, 0.55);
        display: flex;
        align-items: center;
      }
      html.dark .loading-text {
        color: rgba(234, 234, 234, 0.5);
      }
      .loading-dot {
        display: inline-block;
        width: 4px;
        height: 4px;
        margin: 0 3px;
        border-radius: 50%;
        background: currentColor;
        animation: loading-blink 1.2s infinite both;
      }
      .loading-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loading-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes loading-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes loading-blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-orb,
        .loading-orb svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="loading-orb">
          <svg width="72" height="72" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4" />
            <circle cx="12" cy="12" r="4" fill="currentColor" opacity="0.55" />
            <circle cx="12" cy="12" r="13.5" stroke="currentColor" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 6" />
          </svg>
        </div>
        <div class="loading-brand">聚玻明视</div>
        <div class="loading-text">
          正在加载<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
